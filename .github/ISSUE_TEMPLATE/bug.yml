name: Bug
description: 재현 가능한 오류 또는 기대 동작과 다른 동작을 기록합니다.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 사용자에게 어떤 문제가 발생하는지 한두 문장으로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 오류를 다시 발생시킬 수 있는 단계를 번호 목록으로 작성합니다.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 오류 메시지, 화면, 로그 등 관찰된 결과를 작성합니다.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: 영향도
      options:
        - 높음 - 핵심 흐름을 진행할 수 없음
        - 중간 - 우회 가능하지만 주요 기능에 영향
        - 낮음 - 제한적인 불편 또는 시각적 문제
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 브라우저·OS·실행 환경·커밋 SHA 등 재현에 필요한 정보를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 첨부 자료 및 관련 Issue
      description: 스크린샷, 로그, 관련 문서·Issue 링크를 작성합니다.
