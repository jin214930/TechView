# Fast CI는 PR에서 빠르게 회귀 오류를 발견하기 위한 필수 검사입니다.
# 실제 DB, 외부 API, E2E, production build처럼 오래 걸리는 검사는 포함하지 않습니다.
name: Fast CI

on:
  pull_request:
    branches:
      - dev

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소해 Actions 사용 시간과 대기 시간을 줄입니다.
concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 소스 조회 외의 쓰기 권한은 부여하지 않습니다.
permissions:
  contents: read

jobs:
  # Backend와 Frontend Job은 의존 관계가 없어 GitHub Actions에서 병렬로 실행됩니다.
  backend:
    name: Backend · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Gradle Wrapper 검증과 Gradle User Home 캐시를 함께 처리합니다.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # test가 컴파일, 단위 테스트와 Modulith 경계 검증만 수행하며 DB와 Docker는 사용하지 않습니다.
      - name: Run backend fast tests
        run: bash gradlew --no-daemon --console=plain test

  frontend:
    name: Frontend · Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # package-lock.json을 캐시 키로 사용해 npm 패키지 다운로드 시간을 줄입니다.
      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # lockfile을 생성한 npm 버전과 CI 버전을 맞춰 플랫폼별 의존성 해석 차이를 방지합니다.
      - name: Set up npm 11.12.1
        run: npm install --global npm@11.12.1

      # lockfile과 정확히 일치하게 설치하며, audit는 별도 Issue에서 관리합니다.
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test
