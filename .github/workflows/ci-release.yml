# Release CI는 dev에서 main으로 병합하기 전 전체 품질을 검증합니다.
# 실제 OpenAI, OCI Object Storage, 운영 데이터베이스에는 연결하지 않습니다.
name: Release CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

# 같은 PR 또는 브랜치에서 새 실행이 시작되면 오래된 검증을 취소합니다.
concurrency:
  group: release-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Release · Source Branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Allow only dev to main pull requests
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" != "dev" ]]; then
            echo "Only dev to main pull requests are allowed. head=$HEAD_REF"
            exit 1
          fi

  backend:
    name: Release · Backend Full
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # GitHub-hosted runner의 Docker를 Testcontainers PostgreSQL이 사용합니다.
      - name: Run backend unit and integration tests
        run: bash gradlew --no-daemon --console=plain test integrationTest

  frontend:
    name: Release · Frontend Quality
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm 11.12.1
        run: npm install --global npm@11.12.1

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test

  e2e:
    name: Release · Mock E2E
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # API 요청은 Playwright route mock이 처리하므로 백엔드는 실행하지 않습니다.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm 11.12.1
        run: npm install --global npm@11.12.1

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mock API browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
