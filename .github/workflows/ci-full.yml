# Full CI는 실제 PostgreSQL과 전체 Spring Context가 필요한 느린 검증을 수동으로 실행합니다.
name: Backend Full CI

on:
  workflow_dispatch:

# 같은 브랜치에서 다시 실행하면 이전 실행을 취소해 Actions 사용 시간을 줄입니다.
concurrency:
  group: backend-full-ci-${{ github.ref }}
  cancel-in-progress: true

# 테스트에는 저장소 읽기 외의 권한이 필요하지 않습니다.
permissions:
  contents: read

jobs:
  backend:
    name: Backend · Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Gradle Wrapper 검증과 Gradle User Home 캐시를 함께 처리합니다.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # GitHub-hosted runner의 Docker에서 Testcontainers PostgreSQL을 실행합니다.
      - name: Run backend unit and integration tests
        run: bash gradlew --no-daemon --console=plain test integrationTest
