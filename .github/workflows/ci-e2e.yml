name: Frontend E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-e2e:
    name: Frontend · Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # AuthProvider와 API client가 초기화될 때 필요한 API origin입니다.
      # 실제 API 요청은 Playwright route mock이 가로채므로 별도 백엔드는 실행하지 않습니다.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm 11.12.1
        run: npm install --global npm@11.12.1

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
