spring:
  application:
    name: techView
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: always

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

custom:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  jwt:
    issuer: techView
    secret-key: ${JWT_SECRET_KEY}
    access-token:
      expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
    refresh-token:
      expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
  cookie:
    token:
      http-only: true
      path: "/api/v1/auth"
  auth:
    refresh-token:
      hash-secret-key: ${REFRESH_TOKEN_HASH_SECRET_KEY}
