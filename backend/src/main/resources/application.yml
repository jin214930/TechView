spring:
  application:
    name: techView
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: always

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

custom:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  jwt:
    issuer: techView
    secret-key: ${JWT_SECRET_KEY}
    access-token:
      expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
    refresh-token:
      expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
  cookie:
    token:
      http-only: true
      path: "/api/v1/auth"
  auth:
    refresh-token:
      hash-secret-key: ${REFRESH_TOKEN_HASH_SECRET_KEY}
      cleanup:
        cron: "0 0 3 * * *"
        time-zone: Asia/Seoul
  voice:
    upload:
      max-file-size: ${AUDIO_MAX_FILE_SIZE:25MB}
    failed-audio-cleanup:
      cron: "0 0 4 * * *"
      time-zone: Asia/Seoul
      batch-size: 100
    orphan-audio-cleanup:
      prefix: interviews/
      grace-period: 24h
      cron: "0 0 5 * * *"
      time-zone: Asia/Seoul
      page-size: 1000
  interview:
    expired-session-cleanup:
      retention-period: 30d
      cron: "0 30 4 * * *"
      time-zone: Asia/Seoul
      batch-size: 100
  processing:
    worker:
      lease-duration: ${PROCESSING_JOB_LEASE_DURATION:2m}
      concurrency: ${PROCESSING_WORKER_CONCURRENCY:2}
      queue-capacity: ${PROCESSING_WORKER_QUEUE_CAPACITY:20}
      polling-delay: ${PROCESSING_WORKER_POLLING_DELAY:10s}
      polling-batch-size: ${PROCESSING_WORKER_POLLING_BATCH_SIZE:20}
  openai:
    base-url: ${OPENAI_BASE_URL}
    api-key: ${OPENAI_API_KEY}
  stt:
    openai:
      model: ${OPENAI_STT_MODEL}
      language: ${OPENAI_STT_LANGUAGE}
      timeout: ${OPENAI_STT_TIMEOUT}
  analysis:
    openai:
      model: ${OPENAI_ANSWER_ANALYSIS_MODEL}
      prompt-version: ${OPENAI_ANSWER_ANALYSIS_PROMPT_VERSION}
      max-output-tokens: ${OPENAI_ANSWER_ANALYSIS_MAX_OUTPUT_TOKENS:1000}
      timeout: ${OPENAI_ANSWER_ANALYSIS_TIMEOUT:60s}
  feedback:
    openai:
      model: ${OPENAI_INTERVIEW_FEEDBACK_MODEL}
      prompt-version: ${OPENAI_INTERVIEW_FEEDBACK_PROMPT_VERSION}
      max-output-tokens: ${OPENAI_INTERVIEW_FEEDBACK_MAX_OUTPUT_TOKENS:2000}
      timeout: ${OPENAI_INTERVIEW_FEEDBACK_TIMEOUT:90s}
