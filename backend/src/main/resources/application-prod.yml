spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.ward.techview: INFO
    org.hibernate.SQL: OFF

storage:
  audio:
    bucket: ${AUDIO_STORAGE_BUCKET}
    region: ${AUDIO_STORAGE_REGION}
    presigned-url-expiration: ${AUDIO_PRESIGNED_URL_EXPIRATION:5m}
    path-style-access-enabled: ${AUDIO_STORAGE_PATH_STYLE_ACCESS_ENABLED:false}

custom:
  cookie:
    token:
      secure: true
      same-site: lax