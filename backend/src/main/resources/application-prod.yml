spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.ward.techview: INFO
    org.hibernate.SQL: OFF

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

storage:
  audio:
    bucket: ${AUDIO_STORAGE_BUCKET}
    region: ${AUDIO_STORAGE_REGION}
    endpoint: ${AUDIO_STORAGE_ENDPOINT}
    access-key: ${AUDIO_STORAGE_ACCESS_KEY}
    secret-key: ${AUDIO_STORAGE_SECRET_KEY}
    presigned-url-expiration: ${AUDIO_PRESIGNED_URL_EXPIRATION:5m}
    path-style-access-enabled: true

custom:
  cookie:
    token:
      secure: true
      same-site: lax
