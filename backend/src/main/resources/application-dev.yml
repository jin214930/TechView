spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    root: INFO
    com.ward.techview: DEBUG
    org.hibernate.SQL: DEBUG

storage:
  audio:
    bucket: ${AUDIO_STORAGE_BUCKET:techview-audio}
    region: ${AUDIO_STORAGE_REGION:ap-northeast-2}
    endpoint: ${AUDIO_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${AUDIO_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${AUDIO_STORAGE_SECRET_KEY:minioadmin}
    presigned-url-expiration: ${AUDIO_PRESIGNED_URL_EXPIRATION:5m}
    path-style-access-enabled: ${AUDIO_STORAGE_PATH_STYLE_ACCESS_ENABLED:true}

custom:
  cookie:
    token:
      secure: false
      same-site: lax