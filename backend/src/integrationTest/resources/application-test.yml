spring:
  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

storage:
  audio:
    bucket: techview-test-audio
    region: ap-northeast-2
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    presigned-url-expiration: 5m
    path-style-access-enabled: true

custom:
  cors:
    allowed-origin: http://localhost:3000
  jwt:
    issuer: techView-test
    secret-key: TECHVIEW_JWT_SECRET_KEY_FOR_INTEGRATION_TESTS
    access-token:
      expiration-time: 15m
    refresh-token:
      expiration-time: 30d
  cookie:
    token:
      http-only: true
      path: /api/v1/auth
      secure: false
      same-site: lax
  auth:
    refresh-token:
      hash-secret-key: TECHVIEW_REFRESH_TOKEN_HASH_SECRET_KEY_FOR_INTEGRATION_TESTS
  openai:
    base-url: http://localhost
    api-key: test-openai-api-key
  stt:
    openai:
      model: gpt-4o-mini-transcribe
      language: ko
      timeout: 1s
  analysis:
    openai:
      model: test-answer-analysis-model
      prompt-version: answer-analysis-test-v1
      max-output-tokens: 1000
      timeout: 1s
  feedback:
    openai:
      model: test-interview-feedback-model
      prompt-version: interview-feedback-test-v1
      max-output-tokens: 2000
      timeout: 1s