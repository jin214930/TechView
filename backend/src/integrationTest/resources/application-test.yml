spring:
  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

custom:
  cors:
    allowed-origin: http://localhost:3000
  jwt:
    issuer: techView-test
    secret-key: TECHVIEW_JWT_SECRET_KEY_FOR_INTEGRATION_TESTS
    access-token:
      expiration-time: 15m
    refresh-token:
      expiration-time: 30d
  cookie:
    token:
      http-only: true
      path: /api/v1/auth
      secure: false
      same-site: lax
