name: techview-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: techview
      POSTGRES_PASSWORD: password
      POSTGRES_DB: techview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    container_name: minio-container
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo "Waiting for MinIO...";
        sleep 2;
      done;
      mc mb --ignore-existing local/techview-audio;
      '
    restart: "no"

volumes:
  postgres-data:
    name: postgres-data
  minio-data:
    name: minio-data
